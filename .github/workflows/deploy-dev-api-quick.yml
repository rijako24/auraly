name: Deploy DEV API quick

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: auraly-dev-api-quick
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish API
        shell: pwsh
        run: |
          dotnet publish src/API/Auraly.Api/Auraly.Api.csproj --configuration Release --output artifacts/api -p:PlaywrightPlatform=linux-x64
          if ($LASTEXITCODE) { throw 'API publish failed.' }
          if (-not (Test-Path 'artifacts/api/.playwright/node/linux-x64/node')) {
            throw 'The Linux PDF driver is missing from the API package.'
          }
          Compress-Archive -Path artifacts/api/* -DestinationPath artifacts/auraly-api-dev.zip -Force

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to DEV
        shell: pwsh
        run: |
          az webapp config appsettings set --resource-group RG-AURALY-DEV --name api-auraly-dev-w5usmo6w --settings 'WEBSITES_CONTAINER_START_TIME_LIMIT=900' --output none
          if ($LASTEXITCODE) { throw 'Could not set DEV startup budget.' }
          az webapp config set --resource-group RG-AURALY-DEV --name api-auraly-dev-w5usmo6w --startup-file 'if [ -f /home/site/wwwroot/start-api.sh ]; then exec bash /home/site/wwwroot/start-api.sh; else exec dotnet /home/site/wwwroot/Auraly.Api.dll; fi' --output none
          if ($LASTEXITCODE) { throw 'Could not set DEV API startup command.' }
          az webapp deploy --resource-group RG-AURALY-DEV --name api-auraly-dev-w5usmo6w --src-path artifacts/auraly-api-dev.zip --type zip --restart true --clean true --async true --track-status false --output none
          if ($LASTEXITCODE) { throw 'DEV API deployment failed.' }

          for ($attempt = 1; $attempt -le 36; $attempt++) {
            try {
              $health = Invoke-WebRequest -Uri 'https://api-auraly-dev-w5usmo6w.azurewebsites.net/health' -TimeoutSec 15
              if ($health.StatusCode -eq 200) {
                $auth = Invoke-WebRequest -Uri 'https://api-auraly-dev-w5usmo6w.azurewebsites.net/api/v1/auth/me' -SkipHttpErrorCheck -TimeoutSec 15
                if ($auth.StatusCode -eq 401) {
                  Write-Host 'DEV API is healthy and authentication middleware responds.'
                  exit 0
                }
              }
            } catch {
              Write-Host "DEV API startup attempt $attempt/36: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          az webapp log startup show --resource-group RG-AURALY-DEV --name api-auraly-dev-w5usmo6w 2>&1 | Write-Host
          throw 'DEV API did not become healthy after deployment.'
