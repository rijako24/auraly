name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: Proyecto de las pruebas puntuales
        required: true
        default: integration
        type: choice
        options:
          - integration
          - foundation
          - browser
          - dev-browser
      integration_test_filter:
        description: Filtro explícito de las pruebas seleccionadas
        required: true
        type: string
      expected_deployed_commit:
        description: Commit DEV esperado para las pruebas que verifican la identidad instalada
        required: false
        type: string

jobs:
  backend:
    if: github.event_name != 'workflow_dispatch' || (inputs.test_suite != 'browser' && inputs.test_suite != 'dev-browser')
    # Keep SQL latency gates on the same fixed Windows generation used to build
    # immutable releases; a floating image is not a stable performance baseline.
    runs-on: windows-2022
    env:
      AURALY_TEST_SQLSERVER: '(localdb)\MSSQLLocalDB'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install SQLPackage 170 for integration tests
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.SqlPackage --version 170.4.83
          "SQLPACKAGE_PATH=$HOME/.dotnet/tools/sqlpackage.exe" >> $env:GITHUB_ENV
      - run: dotnet restore Auraly.Commerce.sln --locked-mode
      - run: dotnet build Auraly.Commerce.sln --no-restore --configuration Release
      - name: Release compiler resources before latency gates
        run: dotnet build-server shutdown
      - name: Install pinned PDF browser
        shell: pwsh
        run: ./tests/Auraly.Foundation.Tests/bin/Release/net8.0/playwright.ps1 install --only-shell chromium
      - run: dotnet test tests/Auraly.Foundation.Tests/Auraly.Foundation.Tests.csproj --no-build --configuration Release
        if: github.event_name != 'workflow_dispatch'
      - run: dotnet test tests/Auraly.Pos.Edge.Host.Tests/Auraly.Pos.Edge.Host.Tests.csproj --no-build --configuration Release
        if: github.event_name != 'workflow_dispatch'
      - run: dotnet test tests/Auraly.Desktop.Tests/Auraly.Desktop.Tests.csproj --no-build --configuration Release
        if: github.event_name != 'workflow_dispatch'
      - name: Run integration regression
        if: github.event_name != 'workflow_dispatch'
        run: dotnet test tests/Auraly.ServerSlice.IntegrationTests/Auraly.ServerSlice.IntegrationTests.csproj --no-build --configuration Release --filter "Isolation!=FreshProcess"
      - name: Run selected regression
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          INTEGRATION_TEST_FILTER: ${{ inputs.integration_test_filter }}
          SELECTED_TEST_SUITE: ${{ inputs.test_suite }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INTEGRATION_TEST_FILTER)) { throw 'Se requiere un filtro de pruebas explícito.' }
          $project = switch ($env:SELECTED_TEST_SUITE) {
            'integration' { 'tests/Auraly.ServerSlice.IntegrationTests/Auraly.ServerSlice.IntegrationTests.csproj' }
            'foundation' { 'tests/Auraly.Foundation.Tests/Auraly.Foundation.Tests.csproj' }
            default { throw 'Proyecto de pruebas no admitido.' }
          }
          $results = Join-Path $env:RUNNER_TEMP 'targeted-integration-results'
          dotnet test $project `
            --no-build --configuration Release --filter $env:INTEGRATION_TEST_FILTER `
            --logger 'trx;LogFileName=targeted.trx' --results-directory $results
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas seleccionadas.' }
          [xml]$report = Get-Content (Join-Path $results 'targeted.trx') -Raw
          if ([int]$report.TestRun.ResultSummary.Counters.executed -eq 0) { throw 'El filtro no ejecutó ninguna prueba.' }
      - name: Run receipt latency in a fresh test process
        if: github.event_name != 'workflow_dispatch'
        run: dotnet test tests/Auraly.ServerSlice.IntegrationTests/Auraly.ServerSlice.IntegrationTests.csproj --no-build --configuration Release --filter "Isolation=FreshProcess"
      - name: Collect failed SQL query plans
        if: failure()
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'sql-diagnostics'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Filter 'auraly-*.sqlplan' -File |
            Copy-Item -Destination $diagnostics
      - name: Retain failed SQL diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-sql-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sql-diagnostics
            tests/Auraly.ServerSlice.IntegrationTests/bin/Release/net8.0/TestResults/portfolio-*-failure-*/**
            tests/Auraly.ServerSlice.IntegrationTests/bin/Release/net8.0/TestResults/portfolio-report-profile-*/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain selected test results
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: selected-backend-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/targeted-integration-results
          retention-days: 7
          if-no-files-found: ignore

  dev-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.test_suite == 'dev-browser'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: auraly-dev-browser-regression
      cancel-in-progress: false
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify installed DEV identity
        run: node -e 'fetch("https://api-auraly-dev-w5usmo6w.azurewebsites.net/health").then(async r=>{if(!r.ok)throw Error("DEV health failed");console.log(await r.text())})'
      - name: Run real browser journeys exclusively in AURALY DEV
        env:
          AURALY_E2E_REAL_LOGIN: '1'
          AURALY_E2E_TARGET: dev
          AURALY_API_URL: https://api-auraly-dev-w5usmo6w.azurewebsites.net
          AURALY_E2E_BASE_URL: https://proud-moss-0d9cf540f.7.azurestaticapps.net
          AURALY_E2E_TENANT_KEY: '@auraly'
          AURALY_E2E_TENANT_ID: a0a10000-0000-0000-0000-000000000000
          AURALY_E2E_BUSINESS_ID: a0a10000-0000-0000-0000-000000000001
          AURALY_E2E_USERNAME: codex.pos.dev
          AURALY_E2E_PASSWORD: ${{ secrets.AURALY_DEV_E2E_QA_PASSWORD }}
          AURALY_E2E_EXPECTED_COMMIT: ${{ inputs.expected_deployed_commit }}
          DEV_BROWSER_TEST_FILTER: ${{ inputs.integration_test_filter }}
        run: |
          if [ -z "$AURALY_E2E_PASSWORD" ] || [ -z "$DEV_BROWSER_TEST_FILTER" ]; then echo 'Falta la credencial QA o el filtro explícito.'; exit 1; fi
          mkdir -p ../work/release-preparation-current
          npx playwright test --config playwright.dev.config.ts --grep "$DEV_BROWSER_TEST_FILTER"
      - name: Retain real DEV journey results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dev-browser-regression-${{ github.run_attempt }}
          path: |
            admin/playwright-report
            admin/test-results
            work/release-preparation-current
          retention-days: 7
          if-no-files-found: ignore
  invoice-pdf-linux:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet build tests/Auraly.Foundation.Tests/Auraly.Foundation.Tests.csproj -c Release
      - name: Install pinned PDF browser and OS libraries
        shell: pwsh
        run: ./tests/Auraly.Foundation.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps --only-shell chromium
      - run: dotnet test tests/Auraly.Foundation.Tests/Auraly.Foundation.Tests.csproj -c Release --no-build --filter FullyQualifiedName~DianInvoicePdfRendererTests

  admin:
    if: github.event_name != 'workflow_dispatch' || inputs.test_suite == 'browser'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:pos
      - run: npm run test:orders-ui
      - run: npm run build
      - name: Install pinned browser for UI regression
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Run selected browser regression with mocked API contracts
        if: github.event_name == 'workflow_dispatch'
        env:
          AURALY_E2E_MANAGE_SERVERS: '1'
          AURALY_E2E_MANAGE_API: '0'
          BROWSER_TEST_FILTER: ${{ inputs.integration_test_filter }}
        run: |
          if [ -z "$BROWSER_TEST_FILTER" ]; then echo 'Se requiere un filtro de pruebas explícito.'; exit 1; fi
          npx playwright test --config playwright.mocked.config.ts --grep "$BROWSER_TEST_FILTER"
      - name: Retain browser regression results
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: browser-regression-${{ github.run_attempt }}
          path: |
            admin/playwright-report
            admin/test-results
          retention-days: 7
          if-no-files-found: ignore
