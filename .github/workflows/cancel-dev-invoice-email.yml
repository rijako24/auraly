name: Cancel DEV invoice email

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cancel:
    runs-on: windows-latest
    environment: dev
    steps:
      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stop DEV email worker and cancel matching pending delivery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resourceGroup = 'RG-AURALY-DEV'
          $appName = 'api-auraly-dev-w5usmo6w'
          $sqlServer = 'sql-auraly-dev-w5usmo6w'
          $rule = "github-cancel-email-$([guid]::NewGuid().ToString('N').Substring(0,10))"
          az webapp stop --resource-group $resourceGroup --name $appName --output none
          try {
            $ip = (Invoke-RestMethod -Uri 'https://api.ipify.org').Trim()
            az sql server firewall-rule create --resource-group $resourceGroup --server $sqlServer --name $rule --start-ip-address $ip --end-ip-address $ip --output none
            $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
            $connection = [System.Data.SqlClient.SqlConnection]::new('Server=tcp:sql-auraly-dev-w5usmo6w.database.windows.net,1433;Initial Catalog=auraly-dev;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;')
            $connection.AccessToken = $token
            $connection.Open()
            try {
              $command = $connection.CreateCommand()
              $command.CommandText = @'
          SET XACT_ABORT ON;
          BEGIN TRANSACTION;
          DECLARE @Now DATETIMEOFFSET(7)=SYSDATETIMEOFFSET();
          DECLARE @MessageId UNIQUEIDENTIFIER;
          DECLARE @DocumentId UNIQUEIDENTIFIER;
          DECLARE @DocumentNumber NVARCHAR(64);
          DECLARE @FiscalNumber NVARCHAR(64);
          DECLARE @ProcessedAt DATETIMEOFFSET(7);
          DECLARE @DeliveredAt DATETIMEOFFSET(7);

          SELECT TOP(1)
            @MessageId=message.MessageId,
            @DocumentId=fiscal.DocumentId,
            @DocumentNumber=sale.DocumentNumber,
            @FiscalNumber=fiscal.FiscalNumber,
            @ProcessedAt=message.ProcessedAt,
            @DeliveredAt=fiscal.DeliveredAt
          FROM dbo.FiscalDocuments fiscal WITH(UPDLOCK,HOLDLOCK)
          JOIN dbo.SalesDocuments sale ON sale.DocumentId=fiscal.DocumentId AND sale.BusinessId=fiscal.BusinessId
          JOIN dbo.Customers customer ON customer.CustomerId=sale.CustomerId AND customer.BusinessId=sale.BusinessId
          JOIN dbo.Parties party ON party.PartyId=customer.PartyId
          JOIN dbo.Businesses business ON business.BusinessId=sale.BusinessId
          JOIN dbo.Tenants tenant ON tenant.TenantId=business.TenantId
          JOIN dbo.TenantProvisioningOutboxMessages message ON message.MessageId=fiscal.DeliveryOutboxMessageId
          WHERE message.Type=N'FiscalInvoiceDelivery'
            AND tenant.Name COLLATE Latin1_General_100_CI_AI LIKE N'%aural%'
            AND party.DisplayName COLLATE Latin1_General_100_CI_AI LIKE N'%ari%caribe%'
            AND fiscal.IssuedAt>=DATEADD(HOUR,-12,@Now)
          ORDER BY fiscal.IssuedAt DESC,fiscal.DocumentId DESC;

          IF @MessageId IS NULL
            THROW 51000,'No recent invoice email was found for the requested customer in the Auraly DEV tenant.',1;

          DECLARE @Result NVARCHAR(24);
          IF @ProcessedAt IS NULL AND @DeliveredAt IS NULL
          BEGIN
            UPDATE dbo.TenantProvisioningOutboxMessages
            SET ProcessedAt=@Now,LeaseId=NULL,LeaseExpiresAt=NULL,
                LastError=N'Cancelled manually in DEV at customer request.'
            WHERE MessageId=@MessageId AND ProcessedAt IS NULL;
            SET @Result=CASE WHEN @@ROWCOUNT=1 THEN N'cancelled' ELSE N'raced' END;
          END
          ELSE SET @Result=N'already-sent';

          COMMIT TRANSACTION;
          SELECT @Result AS Result,@DocumentNumber AS DocumentNumber,@FiscalNumber AS FiscalNumber,
                 @ProcessedAt AS PreviousProcessedAt,@DeliveredAt AS DeliveredAt;
          '@
              $reader = $command.ExecuteReader()
              if (-not $reader.Read()) { throw 'The cancellation command returned no result.' }
              [ordered]@{
                result = $reader['Result']
                documentNumber = $reader['DocumentNumber']
                fiscalNumber = $reader['FiscalNumber']
                previousProcessedAt = if ($reader['PreviousProcessedAt'] -is [DBNull]) { $null } else { $reader['PreviousProcessedAt'] }
                deliveredAt = if ($reader['DeliveredAt'] -is [DBNull]) { $null } else { $reader['DeliveredAt'] }
              } | ConvertTo-Json -Compress | Write-Output
            } finally {
              $connection.Dispose()
            }
          } finally {
            az sql server firewall-rule delete --resource-group $resourceGroup --server $sqlServer --name $rule --output none 2>$null
            az webapp start --resource-group $resourceGroup --name $appName --output none
          }
