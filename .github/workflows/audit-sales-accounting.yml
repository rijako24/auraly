name: Audit sales accounting

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to inspect without changing business data
        required: true
        type: choice
        options: [dev, prod]
      tenant_fragment:
        description: Fragment of the tenant key
        required: true
        type: string
      from_date:
        description: Earliest invoice date (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: windows-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect bounded invoice, inventory and journal aggregates
        shell: pwsh
        env:
          AUDIT_ENVIRONMENT: ${{ inputs.environment }}
          TENANT_FRAGMENT: ${{ inputs.tenant_fragment }}
          FROM_DATE: ${{ inputs.from_date }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TENANT_FRAGMENT -notmatch '^[a-zA-Z0-9_-]{3,64}$') { throw 'Invalid tenant fragment.' }
          $from = [datetime]::MinValue
          if (-not [datetime]::TryParseExact($env:FROM_DATE, 'yyyy-MM-dd', [cultureinfo]::InvariantCulture, [System.Globalization.DateTimeStyles]::None, [ref]$from)) { throw 'Invalid from date.' }
          $suffix = if ($env:AUDIT_ENVIRONMENT -eq 'dev') { 'dev-w5usmo6w' } else { 'prod-7sov4nxc' }
          $resourceGroup = if ($env:AUDIT_ENVIRONMENT -eq 'dev') { 'RG-AURALY-DEV' } else { 'RG-AURALY-PROD' }
          $server = "sql-auraly-$suffix"
          $database = if ($env:AUDIT_ENVIRONMENT -eq 'dev') { 'auraly-dev' } else { 'auraly-prod' }
          $rule = "github-audit-$([guid]::NewGuid().ToString('N').Substring(0,10))"
          $createdRule = $false
          try {
            $ip = (Invoke-RestMethod -Uri 'https://api.ipify.org').Trim()
            az sql server firewall-rule create --resource-group $resourceGroup --server $server --name $rule --start-ip-address $ip --end-ip-address $ip --output none
            if ($LASTEXITCODE -ne 0) { throw 'Could not open the temporary SQL firewall rule.' }
            $createdRule = $true
            $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) { throw 'Could not obtain the SQL access token.' }
            $connection = [System.Data.SqlClient.SqlConnection]::new("Server=tcp:$server.database.windows.net,1433;Initial Catalog=$database;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;")
            $connection.AccessToken = $token
            $connection.Open()
            try {
              $command = $connection.CreateCommand()
              $command.CommandTimeout = 60
              $command.CommandText = @'
          IF (SELECT COUNT(*) FROM dbo.Tenants WHERE TenantKey LIKE N'%' + @TenantFragment + N'%') <> 1
            THROW 51000,'The tenant fragment must identify exactly one tenant.',1;

          SELECT TOP (200) s.DocumentId,s.DocumentType,s.DocumentNumber,s.IssuedAt,s.TaxAmount
          INTO #Sales
          FROM dbo.SalesDocuments s
          JOIN dbo.Businesses b ON b.BusinessId=s.BusinessId
          JOIN dbo.Tenants t ON t.TenantId=b.TenantId
          WHERE t.TenantKey LIKE N'%' + @TenantFragment + N'%'
            AND s.IssuedAt >= @FromDate AND s.ProcessingStatus=N'Completed'
            AND s.DocumentType IN (N'SalesInvoice',N'SalesReceipt')
          ORDER BY s.IssuedAt DESC;

          SELECT m.DocumentId,COUNT(*) MovementCount,
                 SUM(CASE WHEN m.ValueChange<0 THEN -m.ValueChange ELSE 0 END) ValuedCost
          INTO #Inventory
          FROM dbo.InventoryMovements m
          JOIN #Sales s ON s.DocumentId=m.DocumentId AND s.DocumentType=m.DocumentType
          GROUP BY m.DocumentId;

          SELECT e.SourceDocumentId DocumentId,COUNT(*) EntryLineCount
          INTO #Journal
          FROM dbo.AccountingEntries e
          JOIN #Sales s ON s.DocumentId=e.SourceDocumentId AND s.DocumentType=e.SourceDocumentType
          JOIN dbo.AccountingEntryLines l ON l.EntryId=e.EntryId
          GROUP BY e.SourceDocumentId;

          SELECT COUNT(*) SampleCount,
                 SUM(CASE WHEN s.TaxAmount>0 THEN 1 ELSE 0 END) TaxableSales,
                 SUM(CASE WHEN COALESCE(i.MovementCount,0)>0 THEN 1 ELSE 0 END) InventorySales,
                 SUM(CASE WHEN COALESCE(i.MovementCount,0)>0 AND COALESCE(i.ValuedCost,0)=0 THEN 1 ELSE 0 END) ZeroValuedInventorySales,
                 SUM(CASE WHEN COALESCE(i.ValuedCost,0)>0 THEN 1 ELSE 0 END) PositiveCostSales,
                 SUM(CASE WHEN COALESCE(j.EntryLineCount,0)=2 THEN 1 ELSE 0 END) TwoLineEntries,
                 SUM(CASE WHEN s.TaxAmount>0 AND COALESCE(j.EntryLineCount,0)<3 THEN 1 ELSE 0 END) TaxWithoutExpectedLine,
                 SUM(CASE WHEN COALESCE(i.ValuedCost,0)>0 AND COALESCE(j.EntryLineCount,0)<4 THEN 1 ELSE 0 END) CostWithoutExpectedLines
          FROM #Sales s
          LEFT JOIN #Inventory i ON i.DocumentId=s.DocumentId
          LEFT JOIN #Journal j ON j.DocumentId=s.DocumentId;

          SELECT TOP (25) s.DocumentNumber,s.DocumentType,s.TaxAmount,
                 COALESCE(i.MovementCount,0) MovementCount,
                 COALESCE(i.ValuedCost,0) ValuedCost,
                 COALESCE(j.EntryLineCount,0) EntryLineCount,
                 COALESCE(job.Status,N'NoJob') PostingStatus
          FROM #Sales s
          LEFT JOIN #Inventory i ON i.DocumentId=s.DocumentId
          LEFT JOIN #Journal j ON j.DocumentId=s.DocumentId
          LEFT JOIN dbo.AccountingPostingJobs job
            ON job.SourceDocumentId=s.DocumentId AND job.SourceDocumentType=s.DocumentType
          ORDER BY s.IssuedAt DESC;
          '@
              [void]$command.Parameters.Add('@TenantFragment',[System.Data.SqlDbType]::NVarChar,64)
              $command.Parameters['@TenantFragment'].Value = $env:TENANT_FRAGMENT
              [void]$command.Parameters.Add('@FromDate',[System.Data.SqlDbType]::DateTimeOffset)
              $command.Parameters['@FromDate'].Value = [datetimeoffset]::new($from,[timespan]::Zero)
              $reader = $command.ExecuteReader()
              try {
                if (-not $reader.Read()) { throw 'The aggregate query returned no row.' }
                $summary = [ordered]@{}
                for ($index=0; $index -lt $reader.FieldCount; $index++) { $summary[$reader.GetName($index)] = if ($reader.IsDBNull($index)) { 0 } else { $reader.GetValue($index) } }
                Write-Output ('SUMMARY ' + ($summary | ConvertTo-Json -Compress))
                [void]$reader.NextResult()
                while ($reader.Read()) {
                  $row = [ordered]@{}
                  for ($index=0; $index -lt $reader.FieldCount; $index++) { $row[$reader.GetName($index)] = $reader.GetValue($index) }
                  Write-Output ('SALE ' + ($row | ConvertTo-Json -Compress))
                }
              } finally { $reader.Dispose() }
            } finally { $connection.Dispose() }
          } finally {
            if ($createdRule) { az sql server firewall-rule delete --resource-group $resourceGroup --server $server --name $rule --output none }
          }
