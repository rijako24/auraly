name: Deploy Auraly Admin

on:
  # Contract changes are published by deploy-auraly-release after the backend.
  # Keep standalone publication explicit for compatible frontend-only changes.
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente que se publicará manualmente"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

concurrency:
  group: auraly-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_dev:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'
    runs-on: ubuntu-latest
    name: Deploy DEV
    steps:
      - uses: actions/checkout@v5
      - name: Build and deploy DEV
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AURALY_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./admin
          api_location: ""
          output_location: ""

  deploy_prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    name: Deploy PROD
    steps:
      - uses: actions/checkout@v5
      - name: Build and deploy PROD
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AURALY_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./admin
          api_location: ""
          output_location: ""
