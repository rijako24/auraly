name: Deploy Auraly release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      version:
        description: Version SemVer inmutable (ej. 0.1.0-rc7)
        required: true
        type: string
      components:
        description: Componentes modificados separados por coma (database,function,api,admin,pos-installer). PROD reutiliza el alcance archivado.
        required: true
        type: string
      publish_pos_installer_in_dev:
        description: Publicar el instalador POS en DEV además de archivarlo para promoción
        required: false
        default: true
        type: boolean
      integration_test_filter:
        description: Filtro puntual revisado; vacío ejecuta toda la regresión
        required: false
        default: ''
        type: string
      baseline_quality_run_id:
        description: Regresión base revisada cuando se usa filtro puntual
        required: false
        default: ''
        type: string

permissions:
  contents: write
  id-token: write

env:
  AURALY_RELEASE_VERSION: ${{ inputs.version }}

concurrency:
  group: auraly-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  admin_build:
    name: Build immutable Admin package
    if: github.ref == 'refs/heads/main' && inputs.environment == 'dev'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Verify Admin source belongs to origin/main
        id: source
        shell: bash
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Build Admin once for both environments
        working-directory: admin
        run: npm ci && npm run build
      - name: Package built Admin with source and hash evidence
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, zipfile
          version = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Invalid immutable release version')
          root = pathlib.Path('admin'); target = pathlib.Path('artifacts/admin-package'); target.mkdir(parents=True)
          package = target / f'auraly-admin-{version}.zip'
          paths = [root / name for name in ('.next', 'public', 'package.json', 'package-lock.json', 'next.config.mjs')]
          with zipfile.ZipFile(package, 'x', compression=zipfile.ZIP_DEFLATED) as archive:
              for path in paths:
                  for item in sorted(path.rglob('*')) if path.is_dir() else [path]:
                      relative = item.relative_to(root)
                      if item.is_file() and not relative.as_posix().startswith(('.next/cache/', '.next/diagnostics/')):
                          archive.write(item, relative.as_posix())
          metadata = dict(version=version, commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              platform='linux-x64', name=package.name, bytes=package.stat().st_size,
              sha256=hashlib.file_digest(package.open('rb'),'sha256').hexdigest(),
              buildId=(root/'.next/BUILD_ID').read_text().strip())
          (target/'admin-package.json').write_text(json.dumps(metadata,indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: auraly-admin-build-${{ inputs.version }}
          path: artifacts/admin-package
          if-no-files-found: error

  release:
    name: Resolve immutable release
    needs: admin_build
    if: always() && github.ref == 'refs/heads/main' && (needs.admin_build.result == 'success' || needs.admin_build.result == 'skipped')
    # WiX 6.0.2 can lose its native pipe on console-less Windows 2025 runners.
    # Keep the release builder on the stable Windows generation until the
    # upstream fix (wixtoolset/wix#701) is available in a stable WiX release.
    runs-on: windows-2022
    environment: ${{ inputs.environment }}
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      components: ${{ steps.metadata.outputs.components }}
      deploy_cloud: ${{ steps.metadata.outputs.deploy_cloud }}
      deploy_admin: ${{ steps.metadata.outputs.deploy_admin }}
      needs_sqlpackage: ${{ steps.metadata.outputs.needs_sqlpackage }}
    steps:
      - name: Checkout source for DEV
        if: inputs.environment == 'dev'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.admin_build.outputs.commit }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        if: inputs.environment == 'dev'
        with:
          name: auraly-admin-build-${{ inputs.version }}
          path: artifacts/admin-package

      - name: Checkout release tag for PROD
        if: inputs.environment == 'prod'
        uses: actions/checkout@v5
        with:
          ref: auraly-v${{ inputs.version }}
          fetch-depth: 0

      - name: Verify deployed commit belongs to origin/main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo consultar origin/main.' }
          if ('${{ inputs.environment }}' -eq 'dev') {
            $main = (git rev-parse origin/main).Trim()
            $head = (git rev-parse HEAD).Trim()
            if ($head -ne $main) { throw 'DEV debe desplegar exactamente origin/main.' }
          } else {
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'El release de PROD no pertenece a origin/main.' }
          }

      - name: Setup .NET
        if: inputs.environment == 'dev'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        if: inputs.environment == 'dev'
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install SQLPackage 170 for release tests
        if: inputs.environment == 'dev'
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.SqlPackage --version 170.4.83
          "SQLPACKAGE_PATH=$HOME/.dotnet/tools/sqlpackage.exe" >> $env:GITHUB_ENV

      - name: Import Auraly code-signing certificate
        if: inputs.environment == 'dev'
        id: signing_certificate
        shell: pwsh
        env:
          AURALY_SIGNING_PFX_BASE64: ${{ secrets.AURALY_SIGNING_PFX_BASE64 }}
          AURALY_SIGNING_PFX_PASSWORD: ${{ secrets.AURALY_SIGNING_PFX_PASSWORD }}
          AURALY_SIGNING_THUMBPRINT: ${{ secrets.AURALY_SIGNING_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AURALY_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:AURALY_SIGNING_PFX_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:AURALY_SIGNING_THUMBPRINT)) {
            throw 'Falta configurar el certificado Authenticode de Auraly.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'auraly-code-signing.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:AURALY_SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:AURALY_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -Password $password
            $expected = $env:AURALY_SIGNING_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
            if ($certificate.Thumbprint -ne $expected -or -not $certificate.HasPrivateKey) {
              throw 'El PFX de publicación no coincide con la huella configurada o no contiene clave privada.'
            }
            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build and test release once in DEV
        if: inputs.environment == 'dev'
        shell: pwsh
        env:
          AURALY_TEST_SQLSERVER: '(localdb)\MSSQLLocalDB'
          RELEASE_INTEGRATION_TEST_FILTER: ${{ inputs.integration_test_filter }}
          RELEASE_BASELINE_QUALITY_RUN_ID: ${{ inputs.baseline_quality_run_id }}
        run: >-
          ./infrastructure/azure/New-AuralyRelease.ps1
          -Version "$env:AURALY_RELEASE_VERSION"
          -PosApiUrl 'https://api-auraly-dev-w5usmo6w.azurewebsites.net'
          -ProdPosApiUrl 'https://api-auraly-prod-7sov4nxc.azurewebsites.net'
          -SigningCertificateThumbprint '${{ steps.signing_certificate.outputs.thumbprint }}'
          -SigningTimestampUrl 'https://timestamp.digicert.com'
          -PrebuiltAdminPackagePath "./artifacts/admin-package/auraly-admin-$env:AURALY_RELEASE_VERSION.zip"
          -IntegrationTestFilter "$env:RELEASE_INTEGRATION_TEST_FILTER"
          -BaselineQualityRunId "$env:RELEASE_BASELINE_QUALITY_RUN_ID"

      - name: Login to Azure release archive with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Record immutable deployment scope in DEV
        if: inputs.environment == 'dev'
        shell: pwsh
        env:
          REQUESTED_COMPONENTS: ${{ inputs.components }}
        run: |
          ./infrastructure/azure/Resolve-AuralyDeploymentComponents.ps1 `
            -Environment dev `
            -ManifestPath "./artifacts/releases/$env:AURALY_RELEASE_VERSION/manifest.json" `
            -RequestedComponents $env:REQUESTED_COMPONENTS `
            -Persist | Format-List

      - name: Archive immutable private release from DEV
        if: inputs.environment == 'dev'
        shell: pwsh
        run: |
          $tag = "auraly-v$env:AURALY_RELEASE_VERSION"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "El tag $tag ya existe y el release no se puede reemplazar."
          }
          $storage = 'stauralydevw5usmo6w'
          $container = 'auraly-releases'
          az storage container create --account-name $storage --name $container --auth-mode login --output none
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar el archivo privado de releases.' }
          # Sin tag no existe un release aprobado: retire solo residuos parciales de esta version.
          az storage blob delete-batch --account-name $storage --source $container --pattern "$env:AURALY_RELEASE_VERSION/*" --auth-mode login --output none
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron retirar residuos parciales de la version.' }
          $manifest = Get-Content "./artifacts/releases/$env:AURALY_RELEASE_VERSION/manifest.json" -Raw | ConvertFrom-Json
          $assets = @(Get-ChildItem "./artifacts/releases/$env:AURALY_RELEASE_VERSION" -File | ForEach-Object FullName)
          foreach ($asset in $assets) {
            $blob = "$env:AURALY_RELEASE_VERSION/" + (Split-Path $asset -Leaf)
            $exists = az storage blob exists --account-name $storage --container-name $container --name $blob --auth-mode login --query exists --output tsv
            if ($LASTEXITCODE -ne 0 -or $exists -eq 'true') { throw "El artefacto inmutable $blob ya existe o no se pudo validar." }
            az storage blob upload --account-name $storage --container-name $container --name $blob --file $asset --auth-mode login --overwrite false --output none
            if ($LASTEXITCODE -ne 0) { throw "No se pudo archivar $blob." }
          }
          git tag $tag $manifest.commit
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar el tag del release.' }

      - name: Download approved release for PROD
        if: inputs.environment == 'prod'
        shell: pwsh
        run: |
          $target = "./artifacts/releases/$env:AURALY_RELEASE_VERSION"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $storage = 'stauralydevw5usmo6w'
          $container = 'auraly-releases'
          $prefix = "$env:AURALY_RELEASE_VERSION/"
          $names = @(az storage blob list --account-name $storage --container-name $container --prefix $prefix --auth-mode login --query '[].name' --output tsv)
          if ($LASTEXITCODE -ne 0 -or $names.Count -eq 0) { throw 'No existe el release privado aprobado solicitado.' }
          foreach ($name in $names) {
            $destination = Join-Path $target (Split-Path $name -Leaf)
            az storage blob download --account-name $storage --container-name $container --name $name --file $destination --auth-mode login --output none
            if ($LASTEXITCODE -ne 0) { throw "No se pudo descargar $name." }
          }

      - name: Validate metadata
        id: metadata
        shell: pwsh
        env:
          REQUESTED_COMPONENTS: ${{ inputs.components }}
        run: |
          $manifest = ./infrastructure/azure/Test-AuralyReleaseArtifacts.ps1 -ReleaseRoot "./artifacts/releases/$env:AURALY_RELEASE_VERSION" -ReleaseVersion "$env:AURALY_RELEASE_VERSION"
          $head = (git rev-parse HEAD).Trim()
          if ($manifest.commit -ne $head -or $manifest.dirty -or $manifest.version -ne "$env:AURALY_RELEASE_VERSION") {
            throw 'El manifiesto no corresponde al commit/tag seleccionado.'
          }
          $scope = ./infrastructure/azure/Resolve-AuralyDeploymentComponents.ps1 `
            -Environment '${{ inputs.environment }}' `
            -ManifestPath "./artifacts/releases/$env:AURALY_RELEASE_VERSION/manifest.json" `
            -RequestedComponents $env:REQUESTED_COMPONENTS
          "commit=$($manifest.commit)" >> $env:GITHUB_OUTPUT
          "artifact_name=auraly-release-$env:AURALY_RELEASE_VERSION" >> $env:GITHUB_OUTPUT
          "components=$($scope.Csv)" >> $env:GITHUB_OUTPUT
          "deploy_cloud=$($scope.DeployCloud.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "deploy_admin=$($scope.DeployAdmin.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "needs_sqlpackage=$($scope.NeedsSqlPackage.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Upload release between jobs
        uses: actions/upload-artifact@v6
        with:
          name: auraly-release-${{ inputs.version }}
          path: artifacts/releases/${{ inputs.version }}
          if-no-files-found: error
          retention-days: 7

  cloud:
    name: Deploy selected cloud components
    needs: release
    if: needs.release.outputs.deploy_cloud == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.release.outputs.artifact_name }}
          path: artifacts/releases/${{ inputs.version }}

      - uses: actions/setup-dotnet@v5
        if: needs.release.outputs.needs_sqlpackage == 'true'
        with:
          dotnet-version: 8.0.x

      - name: Install SQLPackage 170
        if: needs.release.outputs.needs_sqlpackage == 'true'
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.SqlPackage --version 170.4.83
          "SQLPACKAGE_PATH=$HOME/.dotnet/tools/sqlpackage" >> $env:GITHUB_ENV

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify DEV App Configuration access before publication
        if: inputs.environment == 'dev' && contains(needs.release.outputs.components, 'function')
        shell: pwsh
        run: |
          az appconfig kv list `
            --name cfg-auraly-dev-w5usmo6w `
            --key 'WhatsApp:Webhook:ApiBaseUrl' `
            --auth-mode login `
            --output none
          if ($LASTEXITCODE -ne 0) {
            throw 'No se pudo acceder a App Configuration antes de publicar la base de datos.'
          }

      - name: Publish cloud release
        shell: pwsh
        env:
          DEPLOYMENT_COMPONENTS: ${{ needs.release.outputs.components }}
          AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${{ secrets.AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH }}
          CJ_WHATSAPP_ACCESS_TOKEN: ${{ inputs.environment == 'dev' && secrets.CJ_WHATSAPP_ACCESS_TOKEN || '' }}
          CJ_WHATSAPP_FUNCTION_KEY: ${{ inputs.environment == 'dev' && secrets.CJ_WHATSAPP_FUNCTION_KEY || '' }}
          CJ_WHATSAPP_VERIFY_TOKEN: ${{ inputs.environment == 'dev' && secrets.CJ_WHATSAPP_VERIFY_TOKEN || '' }}
        run: |
          $components = @($env:DEPLOYMENT_COMPONENTS -split ',' | Where-Object { $_ -notin @('admin', 'pos-installer') })
          if ($components.Count -gt 0) {
            ./infrastructure/azure/Publish-AuralyReleasePipeline.ps1 `
              -Environment '${{ inputs.environment }}' `
              -ReleaseVersion "$env:AURALY_RELEASE_VERSION" `
              -Components $components `
              -AllowRecordedComponentSubset `
              -SqlPackagePath $env:SQLPACKAGE_PATH
          }

  pos_installer:
    name: Publish POS installer
    needs:
      - release
      - cloud
    if: always() && needs.release.result == 'success' && (needs.cloud.result == 'success' || needs.cloud.result == 'skipped') && contains(needs.release.outputs.components, 'pos-installer') && (inputs.environment == 'prod' || inputs.publish_pos_installer_in_dev)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.release.outputs.artifact_name }}
          path: artifacts/releases/${{ inputs.version }}

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish signed POS installer
        shell: pwsh
        run: |
          ./infrastructure/azure/Publish-AuralyReleasePipeline.ps1 `
            -Environment '${{ inputs.environment }}' `
            -ReleaseVersion "$env:AURALY_RELEASE_VERSION" `
            -Components pos-installer `
            -AllowRecordedComponentSubset

  admin:
    name: Deploy Admin
    needs:
      - release
      - cloud
      - pos_installer
    if: always() && needs.release.result == 'success' && needs.release.outputs.deploy_admin == 'true' && (needs.cloud.result == 'success' || needs.cloud.result == 'skipped') && (needs.pos_installer.result == 'success' || needs.pos_installer.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.release.outputs.artifact_name }}
          path: artifacts/releases/${{ inputs.version }}
      - name: Validate and extract the immutable Admin package
        shell: pwsh
        run: |
          $release = "./artifacts/releases/$env:AURALY_RELEASE_VERSION"
          $manifest = ./infrastructure/azure/Test-AuralyReleaseArtifacts.ps1 -ReleaseRoot $release -ReleaseVersion "$env:AURALY_RELEASE_VERSION"
          if ($manifest.commit -ne '${{ needs.release.outputs.commit }}') { throw 'El frontend no corresponde al commit aprobado.' }
          $archive = Join-Path $release "auraly-admin-$env:AURALY_RELEASE_VERSION.zip"
          Expand-Archive -LiteralPath $archive -DestinationPath './artifacts/admin-deploy'
          foreach ($required in @('.next/BUILD_ID','.next/standalone/server.js','package.json','next.config.mjs')) {
            if (-not (Test-Path -LiteralPath (Join-Path './artifacts/admin-deploy' $required))) { throw "Falta $required en el frontend precompilado." }
          }

      - name: Deploy Admin DEV
        if: inputs.environment == 'dev'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AURALY_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./artifacts/admin-deploy
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Deploy Admin PROD
        if: inputs.environment == 'prod'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AURALY_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./artifacts/admin-deploy
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  verify:
    name: Verify environment
    needs:
      - release
      - cloud
      - pos_installer
      - admin
    if: always() && needs.release.result == 'success' && (needs.cloud.result == 'success' || needs.cloud.result == 'skipped') && (needs.pos_installer.result == 'success' || needs.pos_installer.result == 'skipped') && (needs.admin.result == 'success' || needs.admin.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Resolve hosts and validate health
        shell: pwsh
        run: |
          if ('${{ inputs.environment }}' -eq 'dev') {
            $suffix = 'dev-w5usmo6w'
            $admin = 'proud-moss-0d9cf540f.7.azurestaticapps.net'
          } else {
            $suffix = 'prod-7sov4nxc'
            $admin = '${{ vars.AURALY_ADMIN_HOST }}'
          }
          $uris = @(
            "https://api-auraly-$suffix.azurewebsites.net/health",
            "https://func-auraly-$suffix.azurewebsites.net/api/health",
            "https://$admin")
          foreach ($uri in $uris) {
            $healthy = $false
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $uri -TimeoutSec 60
                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {
                if ($attempt -eq 6) { throw }
              }
              Start-Sleep -Seconds 10
            }
            if (-not $healthy) { throw "$uri no quedo saludable despues de 6 intentos." }
          }
          "## Verificacion final" >> $env:GITHUB_STEP_SUMMARY
          "Release ``$env:AURALY_RELEASE_VERSION`` saludable en ``${{ inputs.environment }}``. Componentes: ``${{ needs.release.outputs.components }}``." >> $env:GITHUB_STEP_SUMMARY
