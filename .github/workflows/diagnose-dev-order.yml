name: Diagnose DEV order

on:
  workflow_dispatch:
    inputs:
      order_number:
        description: Pedido externo exacto (PED-...)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: windows-latest
    environment: dev
    steps:
      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect duplicate customer references
        if: inputs.order_number == '__TENANT_CUSTOMER_DUPLICATES__'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rule = "github-customer-diagnose-$([guid]::NewGuid().ToString('N').Substring(0,8))"
          try {
            $ip = (Invoke-RestMethod -Uri 'https://api.ipify.org').Trim()
            az sql server firewall-rule create --resource-group RG-AURALY-DEV --server sql-auraly-dev-w5usmo6w --name $rule --start-ip-address $ip --end-ip-address $ip --output none
            if ($LASTEXITCODE) { throw 'Temporary SQL firewall rule failed.' }
            $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
            if ($LASTEXITCODE) { throw 'Azure SQL token failed.' }
            $connection = [System.Data.SqlClient.SqlConnection]::new('Server=tcp:sql-auraly-dev-w5usmo6w.database.windows.net,1433;Initial Catalog=auraly-dev;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;')
            $connection.AccessToken = $token
            $connection.Open()
            try {
              $command = $connection.CreateCommand()
              $command.CommandText = @'
          SELECT CustomerId,PartyId,TenantId,RequiresElectronicInvoice,IsActive,CreatedAt,UpdatedAt
          FROM dbo.Customers c
          WHERE EXISTS(SELECT 1 FROM dbo.Customers other
                       WHERE other.TenantId=c.TenantId AND other.PartyId=c.PartyId
                         AND other.CustomerId<>c.CustomerId)
          ORDER BY TenantId,PartyId,CreatedAt,CustomerId;
          '@
              $reader = $command.ExecuteReader()
              while ($reader.Read()) {
                [ordered]@{
                  customerId = $reader['CustomerId']; partyId = $reader['PartyId']; tenantId = $reader['TenantId'];
                  electronicInvoice = $reader['RequiresElectronicInvoice']; active = $reader['IsActive'];
                  createdAt = $reader['CreatedAt']; updatedAt = if ($reader['UpdatedAt'] -is [DBNull]) { $null } else { $reader['UpdatedAt'] }
                } | ConvertTo-Json -Compress | Write-Output
              }
              $reader.Close()
              $command.CommandText = @'
          SELECT c.CustomerId INTO #DuplicateCustomerIds
          FROM dbo.Customers c
          WHERE EXISTS(SELECT 1 FROM dbo.Customers other
                       WHERE other.TenantId=c.TenantId AND other.PartyId=c.PartyId
                         AND other.CustomerId<>c.CustomerId);
          DECLARE @sql nvarchar(max);
          SELECT @sql=STRING_AGG(CAST(
            N'SELECT N''' + OBJECT_SCHEMA_NAME(fk.parent_object_id) + N'.' +
            OBJECT_NAME(fk.parent_object_id) + N''' ParentTable,source.' +
            QUOTENAME(COL_NAME(col.parent_object_id,col.parent_column_id)) +
            N' CustomerId,COUNT_BIG(*) ReferenceCount FROM ' +
            QUOTENAME(OBJECT_SCHEMA_NAME(fk.parent_object_id)) + N'.' +
            QUOTENAME(OBJECT_NAME(fk.parent_object_id)) + N' source JOIN #DuplicateCustomerIds ids ON ids.CustomerId=source.' +
            QUOTENAME(COL_NAME(col.parent_object_id,col.parent_column_id)) +
            N' GROUP BY source.' + QUOTENAME(COL_NAME(col.parent_object_id,col.parent_column_id))
            AS nvarchar(max)),N' UNION ALL ')
          FROM sys.foreign_keys fk
          JOIN sys.foreign_key_columns col ON col.constraint_object_id=fk.object_id
          WHERE fk.referenced_object_id=OBJECT_ID(N'dbo.Customers')
            AND COL_NAME(col.referenced_object_id,col.referenced_column_id)=N'CustomerId';
          EXEC sys.sp_executesql @sql;
          '@
              $reader = $command.ExecuteReader()
              while ($reader.Read()) {
                [ordered]@{
                  parentTable = $reader['ParentTable']; customerId = $reader['CustomerId'];
                  referenceCount = $reader['ReferenceCount']
                } | ConvertTo-Json -Compress | Write-Output
              }
              $reader.Close()
            } finally { $connection.Dispose() }
          } finally {
            az sql server firewall-rule delete --resource-group RG-AURALY-DEV --server sql-auraly-dev-w5usmo6w --name $rule --output none 2>$null
          }

      - name: Inspect order processing without exposing customer data
        if: inputs.order_number != '__TENANT_CUSTOMER_DUPLICATES__'
        shell: pwsh
        env:
          ORDER_NUMBER: ${{ inputs.order_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rule = "github-diagnose-$([guid]::NewGuid().ToString('N').Substring(0,10))"
          try {
            $ip = (Invoke-RestMethod -Uri 'https://api.ipify.org').Trim()
            az sql server firewall-rule create --resource-group RG-AURALY-DEV --server sql-auraly-dev-w5usmo6w --name $rule --start-ip-address $ip --end-ip-address $ip --output none
            $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
            $connection = [System.Data.SqlClient.SqlConnection]::new('Server=tcp:sql-auraly-dev-w5usmo6w.database.windows.net,1433;Initial Catalog=auraly-dev;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;')
            $connection.AccessToken = $token
            $connection.Open()
            try {
              $command = $connection.CreateCommand()
              $command.CommandText = @'
          SELECT TOP(1)
            o.ExternalDocumentNumber AS OrderNumber,
            o.Total AS OrderTotal,
            d.DocumentNumber,
            d.DocumentType,
            d.PayableAmount,
            d.ProcessingStatus,
            p.Status AS ProcessingJobStatus,
            p.ProcessingSequence,
            p.AttemptCount AS ProcessingAttempts,
            COALESCE(p.LastError,N'') AS ProcessingError,
            processingCursor.LastCompletedSequence,
            processingCursor.LastAssignedSequence,
            (SELECT COUNT(*) FROM dbo.DocumentProcessingJobs predecessor
             WHERE predecessor.BusinessId=o.BusinessId
               AND predecessor.ProcessingSequence<p.ProcessingSequence
               AND predecessor.Status<>N'Completed') AS PriorIncompleteJobs,
            COALESCE(r.Status,N'NotCreated') AS ReportingStatus,
            COALESCE(r.LastError,N'') AS ReportingError
          FROM dbo.Orders o
          LEFT JOIN dbo.OrderInvoiceLinks l ON l.OrderId=o.OrderId
          LEFT JOIN dbo.SalesDocuments d ON d.DocumentId=l.DocumentId
          LEFT JOIN dbo.DocumentProcessingJobs p
            ON p.DocumentId=d.DocumentId AND p.DocumentType=d.DocumentType
          LEFT JOIN dbo.BusinessProcessingCursors processingCursor
            ON processingCursor.BusinessId=o.BusinessId
          LEFT JOIN reporting.SalesReportingJobs r
            ON r.SourceDocumentId=d.DocumentId AND r.SourceDocumentType=d.DocumentType
          WHERE o.ExternalDocumentNumber=@OrderNumber
          ORDER BY l.CreatedAt DESC;
          '@
              [void]$command.Parameters.Add('@OrderNumber',[System.Data.SqlDbType]::NVarChar,64)
              $command.Parameters['@OrderNumber'].Value = $env:ORDER_NUMBER
              $reader = $command.ExecuteReader()
              if (-not $reader.Read()) { throw "Order was not found: $env:ORDER_NUMBER" }
              [ordered]@{
                orderNumber = $reader['OrderNumber']
                orderTotal = $reader['OrderTotal']
                documentNumber = if ($reader['DocumentNumber'] -is [DBNull]) { $null } else { $reader['DocumentNumber'] }
                documentType = if ($reader['DocumentType'] -is [DBNull]) { $null } else { $reader['DocumentType'] }
                payableAmount = if ($reader['PayableAmount'] -is [DBNull]) { $null } else { $reader['PayableAmount'] }
                processingStatus = if ($reader['ProcessingStatus'] -is [DBNull]) { $null } else { $reader['ProcessingStatus'] }
                processingJobStatus = if ($reader['ProcessingJobStatus'] -is [DBNull]) { $null } else { $reader['ProcessingJobStatus'] }
                processingSequence = if ($reader['ProcessingSequence'] -is [DBNull]) { $null } else { $reader['ProcessingSequence'] }
                processingAttempts = if ($reader['ProcessingAttempts'] -is [DBNull]) { $null } else { $reader['ProcessingAttempts'] }
                processingError = $reader['ProcessingError']
                lastCompletedSequence = if ($reader['LastCompletedSequence'] -is [DBNull]) { $null } else { $reader['LastCompletedSequence'] }
                lastAssignedSequence = if ($reader['LastAssignedSequence'] -is [DBNull]) { $null } else { $reader['LastAssignedSequence'] }
                priorIncompleteJobs = $reader['PriorIncompleteJobs']
                reportingStatus = $reader['ReportingStatus']
                reportingError = $reader['ReportingError']
              } | ConvertTo-Json -Compress | Write-Output
            } finally {
              $connection.Dispose()
            }
          } finally {
            az sql server firewall-rule delete --resource-group RG-AURALY-DEV --server sql-auraly-dev-w5usmo6w --name $rule --output none 2>$null
          }
